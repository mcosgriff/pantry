# Runs on every pull request and push to main.
# Action versions are pinned to commit SHAs; Dependabot keeps them current.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The unit tests, the screenshot and accessibility tests among them, with Kover measuring them; the
      # merged report goes to Codecov.
      - name: Unit tests
        run: ./gradlew :domain:test testDebugUnitTest koverXmlReportCoverage

      # Coverage only: a failed upload doesn't fail the build. CODECOV_TOKEN is a repository secret, so
      # a pull request from a fork uploads nothing.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/reportCoverage.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Android lint
        run: ./gradlew :app:lintDebug

      # Release builds run R8; catches shrinking problems before a tag does. No signing secrets here,
      # so the APK is unsigned.
      - name: Debug + release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # Exodus Privacy's tracker scanner on that release APK: no tracker, and no permission that isn't in
      # .github/privacy/permissions.txt. The same check as release.yml, so a problem shows before merging.
      - name: Exodus tracker scan
        run: .github/scripts/exodus-scan.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/exodus"

      # The screenshot tests run with the unit tests: on a mismatch, Roborazzi writes each screen as drawn
      # now beside its reference and the difference (`*_compare.png`).
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      # Each test's output and the HTML report, for a failure that only happens here.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            */build/test-results/
            */build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
