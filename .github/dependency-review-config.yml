# Read by actions/dependency-review-action in .github/workflows/dependencies.yml (#246).

# Any known vulnerability, of any severity, in a dependency the PR adds or moves to.
fail-on-severity: low

# Licences that can be combined with the app's GPL-3.0 in one APK. Apache-2.0 is compatible with
# GPL-3.0 (not with GPL-2.0 only). Not listed, so a PR bringing one in stops for a decision:
# EPL (compatible only with its secondary-licence clause), CDDL, and anything proprietary or unknown.
allow-licenses:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - Zlib
  - CC0-1.0
  - Unlicense
  - MPL-2.0
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later

