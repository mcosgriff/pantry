<!doctype html>
<html lang="en">
<head>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button,input{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px var(--space-5) var(--space-3); display: flex; align-items: center; gap: var(--space-2)">
    <label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 14px; background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius-lg); color: var(--ink-muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search pantry</span>
      <input type="search" value="saffron" style="flex: 1; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: var(--ink)">
      <button aria-label="Clear search" style="width: 36px; height: 36px; border: none; border-radius: var(--radius-full); background: transparent; color: var(--ink-muted); display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </label>
    <a href="Main.dc.html" style="height: var(--tap-min); padding: 0 var(--space-2); display: flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600">Cancel</a>
  </header>

  <main style="flex: 1; padding: 64px var(--space-6) 0; display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center">
    <div aria-hidden="true" style="width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--ink-muted); display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5M8.5 11h5"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">No “saffron” in your pantry</h1>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted)">Searched names, notes and barcodes in Dry, Fridge and Freezer.</p>
    </div>
    <div style="align-self: stretch; display: flex; flex-direction: column; gap: 10px; margin-top: var(--space-2)">
      <button style="height: var(--button-height); border-radius: var(--radius-lg); border: none; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600">Add “saffron” to shopping list</button>
      <a href="ItemEdit.dc.html" style="height: var(--button-height); border-radius: var(--radius-lg); border: 1px solid var(--border-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Add to pantry by hand</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
