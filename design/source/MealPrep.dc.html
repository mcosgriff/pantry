<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meal prep</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; position: relative; overflow: hidden">
  <header style="padding: 52px var(--space-5) var(--space-3); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: var(--ink-muted); font-weight: 500">Week of Nov 9</span>
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.5px">Meal prep</h1>
    </div>
    <div role="tablist" aria-label="Day" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button role="tab" aria-selected="{{d.selected}}" style="height: 56px; border-radius: var(--radius-md); border: {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0">
          <span style="font-size: 12px; font-weight: 500">{{d.name}}</span>
          <span style="font-size: 16px; font-weight: 700; font-family: var(--font-display)">{{d.num}}</span>
          <span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 3px; background: {{d.dot}}"></span>
        </button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-1) var(--space-5) 0; display: flex; flex-direction: column; gap: 18px">
    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Use soon <a href="Expiring.dc.html" style="letter-spacing: 0; text-transform: none; font-size: 13px">See all 5</a></h2>
      <div style="display: flex; gap: var(--space-2); overflow: hidden">
        <sc-for list="{{soon}}" as="s" hint-placeholder-count="3">
          <div style="flex-shrink: 0; padding: 10px 12px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; min-width: 112px">
            <span style="font-size: 14px; font-weight: 600; white-space: nowrap">{{s.name}}</span>
            <span style="font-size: 12px; font-weight: 600; color: {{s.color}}">{{s.when}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">This week</h2>
      <sc-for list="{{meals}}" as="m" hint-placeholder-count="3">
        <a href="MealDetail.dc.html" style="display: flex; gap: var(--space-3); align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); text-decoration: none; color: var(--ink)">
          <div style="width: 44px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
            <span style="font-size: 12px; font-weight: 500; color: var(--ink-muted)">{{m.day}}</span>
            <span style="font-size: 18px; font-weight: 700; font-family: var(--font-display)">{{m.num}}</span>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 15px; font-weight: 600">{{m.name}}</span>
            <span style="font-size: 13px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.uses}}</span>
            <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--space-2); background: {{m.badgeBg}}; color: {{m.badgeFg}}">{{m.badge}}</span>
          </div>
        </a>
      </sc-for>
    </section>
  </main>

  <button style="position: absolute; right: var(--space-5); bottom: 96px; height: var(--fab-height); padding: 0 22px 0 18px; border-radius: var(--radius-xl); border: none; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: var(--shadow-fab)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Plan a meal
  </button>

  <nav aria-label="Main" style="height: var(--nav-height); background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: var(--space-2)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <a href="{{t.href}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); text-decoration: none; color: {{t.color}}; font-size: 12px; font-weight: {{t.weight}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const planned = { 10: true, 12: true, 14: true };
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((name, i) => {
      const num = 9 + i, sel = num === 10;
      return {
        name, num, selected: sel ? 'true' : 'false',
        border: sel ? 'none' : '1px solid var(--border)',
        bg: sel ? 'var(--ink)' : 'var(--surface)',
        fg: sel ? 'var(--ground)' : 'var(--ink)',
        dot: planned[num] ? (sel ? 'var(--ground)' : 'var(--accent)') : 'transparent'
      };
    });
    const soon = [
      { name: 'Eggs', when: 'In 2 days', color: 'var(--warning)' },
      { name: 'Rotisserie chicken', when: 'In 3 days', color: 'var(--warning)' },
      { name: 'Greek yogurt', when: 'In 5 days', color: 'var(--warning)' }
    ];
    const ok = { badgeBg: 'var(--surface-muted)', badgeFg: 'var(--ink)' };
    const buy = { badgeBg: 'var(--warning-container)', badgeFg: 'var(--on-warning-container)' };
    const meals = [
      { day: 'Mon', num: 10, name: 'Spinach egg bites', uses: 'Eggs, spinach, cheese · 12 servings', badge: 'All in pantry', ...ok },
      { day: 'Wed', num: 12, name: 'Chicken rice bowls', uses: 'Rotisserie chicken, jasmine rice', badge: '1 to buy', ...buy },
      { day: 'Fri', num: 14, name: 'Yogurt parfaits', uses: 'Greek yogurt, blueberries, granola', badge: 'All in pantry', ...ok }
    ];
    const tab = (label, href, icon, on) => ({ label, href, icon, color: on ? 'var(--accent)' : 'var(--ink-muted)', weight: on ? 600 : 500 });
    return {
      days, soon, meals,
      tabs: [
        tab('Pantry', 'Main.dc.html', 'M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM4 10h16M4 16h16', false),
        tab('Meal prep', 'MealPrep.dc.html', 'M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 9h18M8 2v4M16 2v4', true),
        tab('Shopping', 'Shopping.dc.html', 'M6 6h15l-1.5 9h-12zM6 6 5 3H2M9 20h.01M18 20h.01', false)
      ],
      theme: this.props.theme ?? 'light'
    };
  }
}
</script>
</body>
</html>
