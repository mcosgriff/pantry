<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button,input{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 48px var(--space-2) var(--space-2); display: flex; align-items: center; gap: var(--space-1)">
    <a href="Main.dc.html" aria-label="Back to pantry" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-size: 18px; line-height: 24px; font-weight: 600">Pantry settings</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-1) var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: 18px">

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0 0 0 var(--space-1); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Storage locations</h2>
      <ul style="list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
        <sc-for list="{{locations}}" as="loc" hint-placeholder-count="3">
          <li style="border-top: {{loc.divider}}">
            <button style="width: 100%; min-height: 60px; padding: 10px 14px; border: none; background: transparent; display: flex; align-items: center; gap: var(--space-3); text-align: left; color: var(--ink)">
              <span style="width: 32px; height: 32px; border-radius: var(--radius-sm); background: {{loc.bg}}; color: {{loc.fg}}; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px">{{loc.letter}}</span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{loc.name}}</span>
                <span style="font-size: 13px; color: var(--ink-muted)">{{loc.detail}}</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-muted)"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </li>
        </sc-for>
        <li style="border-top: 1px solid var(--divider)">
          <button style="width: 100%; height: var(--button-height); padding: 0 14px; border: none; background: transparent; display: flex; align-items: center; gap: var(--space-3); color: var(--accent); font-size: 15px; font-weight: 600">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            Add location
          </button>
        </li>
      </ul>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0 0 0 var(--space-1); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Expiration alerts</h2>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
        <label style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height)">
          <span style="font-size: 15px">Notifications</span>
          <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--accent)">
        </label>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
          <span style="font-size: 15px">Warn me</span>
          <span style="font-size: 15px; color: var(--ink-muted)">3 days before</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
          <span style="font-size: 15px">Daily digest</span>
          <span style="font-size: 15px; color: var(--ink-muted)">8:00 AM</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0 0 0 var(--space-1); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Scanning</h2>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
        <label style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height)">
          <span style="font-size: 15px">Batch scan by default</span>
          <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--accent)">
        </label>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
          <span style="font-size: 15px">Default location</span>
          <span style="font-size: 15px; color: var(--ink-muted)">Last used</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
          <span style="font-size: 15px">Product lookup</span>
          <span style="font-size: 15px; color: var(--ink-muted)">Open Food Facts</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
          <span style="font-size: 15px">Units</span>
          <span style="font-size: 15px; color: var(--ink-muted)">US (lb, oz)</span>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const locations = [
      { letter: 'D', name: 'Dry pantry', detail: 'Default shelf life: none', bg: 'var(--dry-container)', fg: 'var(--dry)' },
      { letter: 'R', name: 'Fridge', detail: 'Default shelf life: 7 days', bg: 'var(--fridge-container)', fg: 'var(--fridge)' },
      { letter: 'F', name: 'Freezer', detail: 'Default shelf life: 3 months', bg: 'var(--freezer-container)', fg: 'var(--freezer)' }
    ].map((l, i) => ({ ...l, divider: i === 0 ? 'none' : '1px solid var(--divider)' }));
    return { locations, theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
