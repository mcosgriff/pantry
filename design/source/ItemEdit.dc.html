<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item details</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 48px var(--space-2) var(--space-2); display: flex; align-items: center; gap: var(--space-1)">
    <a href="Main.dc.html" aria-label="Back to pantry" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-size: 18px; line-height: 24px; font-weight: 600">Item details</h1>
    <button aria-label="More actions" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); border: none; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
    </button>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-1) var(--space-5) 0; display: flex; flex-direction: column; gap: 14px">

    <section style="display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl)">
      <div style="width: 60px; height: 60px; border-radius: var(--radius-lg); background: var(--surface-muted); border: 1px dashed var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink-muted); text-align: center; flex-shrink: 0">Photo</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1)">
        <label style="position: absolute; width: 1px; height: 1px; overflow: hidden" for="itemName">Name</label>
        <input id="itemName" value="Organic large eggs, 24 ct" style="border: none; padding: 0; font-size: 18px; font-weight: 600; color: var(--ink); background: transparent; outline: none">
        <span style="font-size: 13px; color: var(--ink-muted); font-family: var(--font-mono)">UPC 0 96619 32108 4</span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">Location</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2)">
        <button aria-pressed="false" style="height: var(--tap-min); border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500">Dry</button>
        <button aria-pressed="true" style="height: var(--tap-min); border-radius: var(--radius-md); border: 2px solid var(--fridge); background: var(--fridge-container); color: var(--fridge); font-size: 14px; font-weight: 600">Fridge</button>
        <button aria-pressed="false" style="height: var(--tap-min); border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500">Freezer</button>
      </div>
    </section>

    <section style="display: flex; gap: var(--space-3)">
      <div style="flex: 1.3; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">Quantity</span>
        <div style="height: var(--field-height); display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 var(--space-1)">
          <button aria-label="Decrease quantity" style="width: var(--tap-min); height: 40px; border: none; background: transparent; font-size: 22px; color: var(--ink)">−</button>
          <span style="font-size: 17px; font-weight: 600">18</span>
          <button aria-label="Increase quantity" style="width: var(--tap-min); height: 40px; border: none; background: transparent; font-size: 22px; color: var(--ink)">+</button>
        </div>
      </div>
      <label style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">Unit</span>
        <select style="height: var(--field-height); padding: 0 var(--space-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 15px; color: var(--ink)">
          <option>each</option><option>lb</option><option>oz</option><option>bag</option><option>pack</option>
        </select>
      </label>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2); padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl)">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">Expires</span>
        <span style="font-size: 12px; font-weight: 600; color: var(--warning); background: var(--warning-container); padding: 3px var(--space-2); border-radius: var(--space-2)">in 2 days</span>
      </div>
      <button style="height: var(--tap-min); border: none; background: transparent; padding: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; line-height: 26px; font-weight: 600; color: var(--ink); font-family: var(--font-display)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
        Thu, Nov 12, 2026
      </button>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <button style="height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface-muted); font-size: 13px; color: var(--ink)">+3 days</button>
        <button style="height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface-muted); font-size: 13px; color: var(--ink)">+1 week</button>
        <button style="height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface-muted); font-size: 13px; color: var(--ink)">+1 month</button>
        <button style="height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface-muted); font-size: 13px; color: var(--ink)">No date</button>
      </div>
    </section>

    <section style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
      <label style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height)">
        <span style="font-size: 15px">Opened</span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--accent)">
      </label>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
        <span style="font-size: 15px">Purchased</span>
        <span style="font-size: 15px; color: var(--ink-muted)">Nov 8, 2026</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider)">
        <span style="font-size: 15px">Low-stock alert</span>
        <span style="font-size: 15px; color: var(--ink-muted)">at 6 each</span>
      </div>
      <label style="display: flex; flex-direction: column; gap: var(--space-1); padding: 10px 14px var(--space-3); border-top: 1px solid var(--divider)">
        <span style="font-size: 15px">Notes</span>
        <input placeholder="e.g. use for Sunday egg bites" style="border: none; padding: 0; font-size: 14px; color: var(--ink); background: transparent; outline: none">
      </label>
    </section>
  </main>

  <footer style="padding: var(--space-3) var(--space-5) 28px; display: flex; gap: 10px; background: var(--ground)">
    <button style="height: var(--button-height); padding: 0 18px; border-radius: var(--radius-lg); border: 1px solid var(--danger-border); background: var(--surface); color: var(--danger); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: var(--space-2)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
      Remove
    </button>
    <button style="flex: 1; height: var(--button-height); border-radius: var(--radius-lg); border: none; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600">Save</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
