<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan: review haul</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px var(--space-2) var(--space-2); display: flex; align-items: center; gap: var(--space-1)">
    <a href="Scan.dc.html" aria-label="Back to scanner" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Review haul</h1>
      <span style="font-size: 13px; color: var(--ink-muted)">14 items scanned</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-2) var(--space-5) 0; display: flex; flex-direction: column; gap: 14px">
    <section style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--warning-container); border-radius: var(--radius-xl)">
      <span style="flex: 1; font-size: 14px; font-weight: 600; color: var(--on-warning-container)">2 items need a name</span>
      <button style="height: 36px; padding: 0 var(--space-3); border: none; border-radius: var(--radius-sm); background: transparent; color: var(--on-warning-container); font-size: 14px; font-weight: 600">Fix</button>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: var(--space-2)">
        <h2 style="margin: 0; display: flex; align-items: center; gap: var(--space-2); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">
          <span style="width: 20px; height: 20px; border-radius: 6px; background: {{g.bg}}; color: {{g.fg}}; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 11px; letter-spacing: 0">{{g.letter}}</span>
          {{g.title}}
        </h2>
        <ul style="list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <li style="border-top: {{it.divider}}">
              <a href="ItemEdit.dc.html" style="display: flex; align-items: center; gap: var(--space-3); padding: 10px 14px; min-height: var(--tap-min); text-decoration: none; color: var(--ink)">
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 15px; font-weight: {{it.weight}}; color: {{it.nameColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
                  <span style="font-size: 13px; color: var(--ink-muted)">{{it.detail}}</span>
                </div>
                <span style="font-size: 14px; font-weight: 600; background: var(--surface-muted); padding: var(--space-1) 10px; border-radius: var(--radius-sm); white-space: nowrap">{{it.qty}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </main>

  <footer style="padding: var(--space-3) var(--space-5) 28px; display: flex; gap: 10px; background: var(--ground)">
    <a href="Scan.dc.html" style="flex: 1; height: var(--button-height); border-radius: var(--radius-lg); border: 1px solid var(--border-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Scan more</a>
    <a href="Main.dc.html" style="flex: 1.6; height: var(--button-height); border-radius: var(--radius-lg); background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Add 14 to pantry</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, detail, qty, missing) => ({
      name, detail, qty,
      weight: missing ? 600 : 500,
      nameColor: missing ? 'var(--warning)' : 'var(--ink)'
    });
    const mark = (items) => items.map((it, i) => ({ ...it, divider: i === 0 ? 'none' : '1px solid var(--divider)' }));
    const groups = [
      { title: 'Fridge · 5', letter: 'R', bg: 'var(--fridge-container)', fg: 'var(--fridge)', items: mark([
        row('Organic large eggs, 24 ct', 'Expires Nov 30', '24 ea'),
        row('Greek yogurt, plain', 'Expires Nov 24', '2 tubs'),
        row('Needs a name', 'UPC 0 81462 30117 2', '1 ea', true)
      ]) },
      { title: 'Freezer · 4', letter: 'F', bg: 'var(--freezer-container)', fg: 'var(--freezer)', items: mark([
        row('Chicken thighs', '3.2 lb · Expires Feb 11', '1 pack'),
        row('Frozen blueberries, 3 lb', 'Expires Mar 2027', '1 bag')
      ]) },
      { title: 'Dry · 5', letter: 'D', bg: 'var(--dry-container)', fg: 'var(--dry)', items: mark([
        row('Sparkling water, lime, 35 pk', 'No date', '35 ea'),
        row('Needs a name', 'UPC 0 96619 44201 7', '1 ea', true)
      ]) }
    ];
    return { groups, theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
