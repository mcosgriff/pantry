<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry list</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="padding: 52px var(--space-5) var(--space-3); display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: var(--ink-muted); font-weight: 500">Home pantry</span>
        <h1 style="margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.5px">Pantry</h1>
      </div>
      <div style="display: flex; gap: var(--space-1)">
        <button aria-label="Sort and filter" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); border: none; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        </button>
        <a href="Settings.dc.html" aria-label="Pantry settings" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); color: var(--ink); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </a>
      </div>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); color: var(--ink-muted)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search pantry</span>
      <input type="search" placeholder="Search 42 items" style="flex: 1; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: var(--ink)">
    </label>

    <div role="tablist" aria-label="Storage location" style="display: flex; gap: var(--space-2)">
      <button role="tab" aria-selected="true" style="height: 36px; padding: 0 14px; border-radius: var(--radius-full); border: none; background: var(--ink); color: var(--ground); font-size: 14px; font-weight: 600">All 42</button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500">Dry 21</button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500">Fridge 12</button>
      <button role="tab" aria-selected="false" style="height: 36px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500">Freezer 9</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-1) var(--space-5) 0; display: flex; flex-direction: column; gap: 18px">

    <section style="display: flex; align-items: center; gap: var(--space-3); padding: 14px var(--space-4); background: var(--warning-container); border-radius: var(--radius-xl)">
      <div style="width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--warning-container-strong); color: var(--on-warning-container); display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600; color: var(--on-warning-container)">4 items expire this week</span>
        <span style="font-size: 13px; color: var(--warning)">1 already expired</span>
      </div>
      <button style="height: 36px; padding: 0 var(--space-3); border: none; border-radius: var(--radius-sm); background: transparent; color: var(--on-warning-container); font-size: 14px; font-weight: 600">View</button>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Expiring first</h2>
      <ul style="list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
        <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
          <li style="border-top: {{item.divider}}">
            <a href="ItemEdit.dc.html" style="display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 14px; text-decoration: none; color: var(--ink); min-height: var(--tap-min)">
              <div style="width: 40px; height: 40px; border-radius: var(--radius-md); background: {{item.tileBg}}; color: {{item.tileFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: var(--font-display); font-weight: 700; font-size: 15px">{{item.loc}}</div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</span>
                <span style="font-size: 13px; color: {{item.expColor}}; font-weight: {{item.expWeight}}">{{item.exp}}</span>
              </div>
              <span style="font-size: 14px; font-weight: 600; color: var(--ink); background: var(--surface-muted); padding: var(--space-1) 10px; border-radius: var(--radius-sm); white-space: nowrap">{{item.qty}}</span>
            </a>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>

  <a href="Scan.dc.html" style="position: absolute; right: var(--space-5); bottom: 96px; height: var(--fab-height); padding: 0 22px 0 18px; border-radius: var(--radius-xl); background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 600; box-shadow: var(--shadow-fab)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"></path></svg>
    Scan items
  </a>

  <nav aria-label="Main" style="height: var(--nav-height); background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: var(--space-2)">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); text-decoration: none; color: var(--accent); font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 10h16M4 16h16"></path></svg>
      Pantry
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); text-decoration: none; color: var(--ink-muted); font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
      Meal prep
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); text-decoration: none; color: var(--ink-muted); font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"></path><path d="M6 6 5 3H2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle></svg>
      Shopping
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const loc = {
      D: { tileBg: 'var(--dry-container)', tileFg: 'var(--dry)' },
      R: { tileBg: 'var(--fridge-container)', tileFg: 'var(--fridge)' },
      F: { tileBg: 'var(--freezer-container)', tileFg: 'var(--freezer)' }
    };
    const status = {
      expired: { expColor: 'var(--danger)', expWeight: 600 },
      soon: { expColor: 'var(--warning)', expWeight: 600 },
      ok: { expColor: 'var(--ink-muted)', expWeight: 400 }
    };
    const raw = [
      { name: 'Baby spinach, 1 lb', loc: 'R', exp: 'Expired yesterday', s: 'expired', qty: '1 bag' },
      { name: 'Organic large eggs, 24 ct', loc: 'R', exp: 'Expires in 2 days · Fridge', s: 'soon', qty: '18 ea' },
      { name: 'Rotisserie chicken', loc: 'R', exp: 'Expires in 3 days · Fridge', s: 'soon', qty: '1 ea' },
      { name: 'Greek yogurt, plain', loc: 'R', exp: 'Expires in 5 days · Fridge', s: 'soon', qty: '2 tubs' },
      { name: 'Chicken thighs, boneless', loc: 'F', exp: 'Jan 14, 2027 · Freezer', s: 'ok', qty: '4 packs' },
      { name: 'Jasmine rice, 25 lb', loc: 'D', exp: 'Aug 2028 · Dry', s: 'ok', qty: '0.6 bag' },
      { name: 'Frozen blueberries, 3 lb', loc: 'F', exp: 'Mar 2027 · Freezer', s: 'ok', qty: '2 bags' }
    ];
    const items = raw.map((r, i) => ({
      ...r, ...loc[r.loc], ...status[r.s],
      divider: i === 0 ? 'none' : '1px solid var(--divider)'
    }));
    return { items, theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
