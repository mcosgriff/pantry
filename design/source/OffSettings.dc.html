<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open Food Facts settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button,input{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px var(--space-2) var(--space-2); display: flex; align-items: center; gap: var(--space-1)">
    <a href="Settings.dc.html" aria-label="Back to settings" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-size: 18px; line-height: 24px; font-weight: 600">Product lookup</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-1) var(--space-5) var(--space-6); display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted)">Pantry can name products by looking up their barcode in Open Food Facts, a free, open database run by volunteers.</p>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0 0 0 var(--space-1); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Looking up</h2>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
        <label style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 10px 14px; min-height: var(--button-height)">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px">Look up scanned barcodes</span>
            <span style="font-size: 13px; color: var(--ink-muted)">Sends only the barcode</span>
          </span>
          <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: var(--accent)">
        </label>
        <label style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 10px 14px; min-height: var(--button-height); border-top: 1px solid var(--divider)">
          <span style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px">Download product photos</span>
            <span style="font-size: 13px; color: var(--ink-muted)">Uses more data</span>
          </span>
          <input type="checkbox" style="width: 22px; height: 22px; accent-color: var(--accent)">
        </label>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0 0 0 var(--space-1); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Contributing</h2>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
        <fieldset style="border: none; margin: 0; padding: 10px 14px 4px">
          <legend style="padding: 0; font-size: 15px">When a product isn't found</legend>
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
            <label style="display: flex; align-items: center; justify-content: space-between; min-height: var(--tap-min); font-size: 14px; color: var(--ink-muted)">
              {{m.label}}
              <input type="radio" name="share" checked="{{m.on}}" style="width: 22px; height: 22px; accent-color: var(--accent)">
            </label>
          </sc-for>
        </fieldset>
        <a href="#" style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider); text-decoration: none; color: var(--ink); font-size: 15px">
          Account
          <span style="font-size: 14px; color: var(--ink-muted)">[To be decided]</span>
        </a>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: var(--button-height); border-top: 1px solid var(--divider); font-size: 15px">
          Products you've added
          <span style="font-size: 15px; font-weight: 600">3</span>
        </div>
      </div>
    </section>

    <a href="#" style="align-self: flex-start; min-height: var(--tap-min); display: flex; align-items: center; font-size: 15px; font-weight: 600">What is shared, and who can use it</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const modes = [['Ask me', true], ['Always share', false], ['Never share', false]]
      .map(([label, on]) => ({ label, on }));
    return { modes, theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
