<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add to Open Food Facts</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pantry/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-pressed)}
button,input{font-family:inherit}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--ground); font-family: var(--font-sans); color: var(--ink); display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 48px var(--space-2) var(--space-2); display: flex; align-items: center; gap: var(--space-1)">
    <a href="OffShare.dc.html" aria-label="Back" style="width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-full); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Add to Open Food Facts</h1>
      <span style="font-size: 13px; color: var(--ink-muted); font-family: var(--font-mono)">UPC 0 41220 57691 3</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: var(--space-1) var(--space-5) 0; display: flex; flex-direction: column; gap: var(--space-4)">
    <section style="display: flex; flex-direction: column; gap: var(--space-2)">
      <h2 style="margin: 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-muted)">Photos <span style="text-transform: none; letter-spacing: 0; font-weight: 500">1 of 3</span></h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2)">
        <sc-for list="{{photos}}" as="p" hint-placeholder-count="3">
          <button style="aspect-ratio: 3 / 4; border-radius: var(--radius-lg); border: {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: var(--space-2)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
            <span style="font-size: 13px; font-weight: 600; text-align: center">{{p.label}}</span>
            <span style="font-size: 12px; color: var(--ink-muted)">{{p.state}}</span>
          </button>
        </sc-for>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: var(--ink-muted)">Photos let volunteers check the product and read its ingredients and nutrition.</span>
    </section>

    <section style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-top: {{f.divider}}">
          <span style="font-size: 13px; font-weight: 600; color: var(--ink-muted)">{{f.label}}</span>
          <input value="{{f.value}}" placeholder="{{f.hint}}" style="border: none; padding: 0; height: 28px; font-size: 15px; color: var(--ink); background: transparent; outline: none">
        </label>
      </sc-for>
    </section>

    <section style="display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); background: var(--surface-muted); border-radius: var(--radius-xl)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color: var(--ink-muted); flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M12 11v5"></path></svg>
      <span style="font-size: 13px; line-height: 18px; color: var(--ink-muted)">Shared as [account to confirm: yours or anonymous through Pantry]. New products may appear after a volunteer checks them.</span>
    </section>
  </main>

  <footer style="padding: var(--space-3) var(--space-5) 28px; display: flex; gap: 10px; background: var(--ground)">
    <a href="ScanReview.dc.html" style="flex: 1; height: var(--button-height); border-radius: var(--radius-lg); border: 1px solid var(--border-strong); color: var(--ink); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Skip</a>
    <a href="ScanReview.dc.html" style="flex: 1.6; height: var(--button-height); border-radius: var(--radius-lg); background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600">Share product</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cam = 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z';
    const done = 'm5 12 5 5 9-10';
    const photos = [
      { label: 'Front', state: 'Taken', icon: done, border: '2px solid var(--accent)', bg: 'var(--surface-muted)', fg: 'var(--accent)' },
      { label: 'Ingredients', state: 'Add', icon: cam, border: '1px dashed var(--border-strong)', bg: 'var(--surface)', fg: 'var(--ink)' },
      { label: 'Nutrition', state: 'Add', icon: cam, border: '1px dashed var(--border-strong)', bg: 'var(--surface)', fg: 'var(--ink)' }
    ];
    const fields = [
      { label: 'Name', value: 'Sparkling water, lime', hint: '' },
      { label: 'Brand', value: '', hint: 'As printed on the package' },
      { label: 'Size', value: '35 × 12 fl oz', hint: '' },
      { label: 'Category', value: '', hint: 'e.g. Sparkling waters' }
    ].map((f, i) => ({ ...f, divider: i === 0 ? 'none' : '1px solid var(--divider)' }));
    return { photos, fields, theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
