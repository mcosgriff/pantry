# Versions follow the Android App Playbook's Toolchain table (checked 2026-11-10).
# Keep AGP current with Android Studio's AGP Upgrade Assistant; Dependabot moves the rest.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
coroutines = "1.11.0"
serialization = "1.12.0"

core-ktx = "1.19.1"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.1"
compose-bom = "2026.09.00"
splashscreen = "1.2.0"
datastore = "1.3.0"
room = "3.0.3"
sqlite = "2.7.1"
hilt = "2.60.1"
camerax = "1.6.2"
hilt-androidx = "1.4.0"

junit = "4.13.2"
# Robolectric (test only) and the Android framework jar it runs the tests on, one per SDK a test asks for
# (`@Config(sdk = [35])`). Robolectric would fetch that jar itself at test time; Gradle resolves, caches
# and verifies it instead (root build.gradle.kts). Each Robolectric release names its own builds of them,
# so these move together: on a Robolectric upgrade, take the version from its `AndroidSdk` list.
robolectric = "4.17"
robolectric-androidAll-sdk35 = "15-robolectric-13954326-i7"
# Screenshot tests on the JVM through Robolectric (#5): test only, nothing of it ships.
roborazzi = "1.76.0"
androidx-test-junit = "1.3.0"
# Test coverage for Codecov (CI only; nothing of it ships).
kover = "0.9.11"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }

camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
# Reads barcodes on the phone (#10). Not ML Kit, which uploads usage logs to Google (CLAUDE.md, Decisions).
# No network code: it depends only on the Kotlin standard library and CameraX (checked in glovebox, #161).
zxing-cpp = { module = "io.github.zxing-cpp:android", version = "3.1.1" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hilt-androidx" }

junit = { module = "junit:junit", version.ref = "junit" }
# Test only: runs Android's SQLite and DataStore on the JVM, so `./gradlew build` tests the database.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-androidAll-sdk35 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-androidAll-sdk35" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
# Google's Accessibility Test Framework, run on the screenshot tests' screens under Robolectric.
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room3", version.ref = "room" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
