# Versions follow the Android App Playbook's Toolchain table (checked 2026-11-10).
# Keep AGP current with Android Studio's AGP Upgrade Assistant; Dependabot moves the rest.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"

core-ktx = "1.19.1"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
compose-bom = "2026.09.00"
splashscreen = "1.2.0"

junit = "4.13.2"
# Robolectric (test only) and the Android framework jar it runs the tests on, one per SDK a test asks for
# (`@Config(sdk = [35])`). Robolectric would fetch that jar itself at test time; Gradle resolves, caches
# and verifies it instead (root build.gradle.kts). Each Robolectric release names its own builds of them,
# so these move together: on a Robolectric upgrade, take the version from its `AndroidSdk` list.
robolectric = "4.17"
robolectric-androidAll-sdk35 = "15-robolectric-13954326-i7"
# Screenshot tests on the JVM through Robolectric (#5): test only, nothing of it ships.
roborazzi = "1.76.0"
androidx-test-junit = "1.3.0"
# Test coverage for Codecov (CI only; nothing of it ships).
kover = "0.9.11"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-androidAll-sdk35 = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectric-androidAll-sdk35" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
# Google's Accessibility Test Framework, run on the screenshot tests' screens under Robolectric.
roborazzi-accessibility-check = { module = "io.github.takahirom.roborazzi:roborazzi-accessibility-check", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
